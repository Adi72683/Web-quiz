<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web Development Quiz App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="quiz.css">
<script src="script.js" defer></script>
</head>

<body>
<header class="page-title">
    <div>
        <h1>WebSprint </h1>
        <p>Test Your Foundational Skills</p>
    </div>
</header>
<main class="container">

    
    <section id="landing" class="card">
        <header>
            <h1>Web Development Quiz</h1>
            <p>20 Questions • 20 Minutes • HTML, CSS, JS</p>
        </header>

        <div class="actions">
           <button type="button" id="startBtn" onclick="startQuiz()">
    Start Quiz
</button>
        </div>
    </section>

    
    <section id="quiz" class="card" hidden>

        <div class="quiz-layout">

           
            <aside class="tracker-container">
                <h2 class="tracker-title">Quiz Map</h2>
                <div id="tracker" class="tracker"></div>
            </aside>

           
            <section class="quiz-content">

                <header class="quiz-header">
                    <div id="timer" class="timer" aria-live="polite"></div>
                </header>

                <div class="progress">
                    <div id="progressBar" class="progress-bar"></div>
                </div>

               
                <h2 id="question"></h2>

                <div id="options"></div>

                <nav class="controls">
                    <button type="button" id="prevBtn" onclick="prevQuestion()">Previous</button>
                    <button type="button" id="nextBtn" onclick="nextQuestion()">Next</button>
                    <button type="button" onclick="submitQuiz()" id="submitBtn">Submit</button>
                </nav>

            </section>
        </div>

    </section>

   
    <section id="result" class="card" hidden>

        <header>
            <h2 id="score"></h2>
            <h3 id="status"></h3>
        </header>

        <div class="result-summary">

            <section class="stat">
                <h3>Correct</h3>
                <p id="correctCount"></p>
            </section>

            <section class="stat">
                <h3>Wrong</h3>
                <p id="wrongCount"></p>
            </section>

        </div>

        
        <section class="review-section">
            <h2>Review</h2>
            <div id="review"></div>
        </section>

        <div class="actions">
            <button type="button" onclick="resetQuiz()">Restart Quiz</button>
        </div>

    </section>

</main>

</body>
</html>
